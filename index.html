<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yoron</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #030714; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; background: radial-gradient(circle at top, #0a1a3a 0%, #030714 70%); }
        .screen { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
        .screen.active { display: flex; }
        
        .auth-box { padding: 40px 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100%; }
        .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; background: #0a1228; border: 1px solid #1e3a8a; color: white; font-size: 16px; outline: none; }
        .auth-btn { width: 100%; padding: 15px; border-radius: 12px; background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%); color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .auth-link { color: #38bdf8; cursor: pointer; text-decoration: underline; }
        .error-text { color: #ef4444; font-size: 14px; margin-top: 10px; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #1e3a8a; }
        .logo { font-weight: 800; font-size: 22px; }
        .logo span { color: #38bdf8; }
        .balance { background: rgba(56, 189, 248, 0.1); padding: 6px 12px; border-radius: 20px; color: #38bdf8; font-weight: 600; border: 1px solid rgba(56, 189, 248, 0.3); }
        
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; display: none; }
        .content.active { display: block; }
        
        .chat-item { background: #0a1228; padding: 15px; border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid #1e3a8a; cursor: pointer; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: linear-gradient(135deg, #1e3a8a, #38bdf8); flex-shrink: 0; }

        #messagesBox { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #0a1228; border-radius: 15px; margin-bottom: 15px; border: 1px solid #1e3a8a; min-height: 50vh; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; }
        .msg.mine { background: linear-gradient(90deg, #2563eb, #38bdf8); color: white; align-self: flex-end; }
        .msg.theirs { background: #1e293b; color: white; align-self: flex-start; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 15px; border-radius: 15px; background: #0a1228; border: 1px solid #1e3a8a; color: white; outline: none; }
        .send-btn { background: #38bdf8; color: black; border: none; padding: 0 20px; border-radius: 15px; font-weight: bold; font-size: 20px; cursor: pointer; }

        .nav { position: absolute; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 15px 10px 25px; background: rgba(6, 15, 36, 0.95); border-top: 1px solid #1e3a8a; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8b98b8; font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: #38bdf8; }
        .nav-item .icon { font-size: 22px; }
    </style>
</head>
<body>
<div id="app">
    <div id="screen-auth" class="screen active">
        <div class="auth-box">
            <h1 style="font-size: 40px; margin-bottom: 5px; color: #38bdf8;">Yoron</h1>
            <p style="color: #8b98b8; margin-bottom: 30px;">Общайся. Создавай. Вдохновляй.</p>
            <input type="text" id="regUsername" class="auth-input" placeholder="@username">
            <input type="password" id="regPassword" class="auth-input" placeholder="Пароль (мин. 6 символов)">
            
            <div id="errorBox" class="error-text"></div>

            <button id="btn-register" class="auth-btn" style="margin-top: 10px;">Создать аккаунт</button>
            <button id="btn-login" class="auth-btn" style="display: none; margin-top: 10px;">Войти</button>
            <p style="margin-top: 20px; font-size: 14px;">
                <span id="auth-toggle-text">Уже есть аккаунт?</span> 
                <span class="auth-link" id="auth-toggle-link">Войти</span>
            </p>
        </div>
    </div>

    <div id="screen-main" class="screen" style="display: none;">
        <div class="header">
            <div class="logo">Yoron<span>.</span></div>
            <div class="balance">💎 <span id="balanceDisplay">0</span></div>
        </div>

        <div id="tab-chats" class="content active">
            <div id="chat-list">
                <h2>Чаты</h2>
                <div class="chat-item" id="chat-btn-ai">
                    <div class="avatar" style="background: linear-gradient(135deg, #1e3a8a, #38bdf8);">🤖</div>
                    <div><div style="font-weight: bold;">@ai</div><div style="color: #8b98b8; font-size: 13px;">ИИ-помощник</div></div>
                </div>
                <div class="chat-item" id="chat-btn-all">
                    <div class="avatar" style="background: linear-gradient(135deg, #b45309, #fbbf24);">🌍</div>
                    <div><div style="font-weight: bold;">@all</div><div style="color: #8b98b8; font-size: 13px;">Общий чат</div></div>
                </div>
            </div>

            <div id="chat-room" style="display: none; flex-direction: column; height: 100%;">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #1e3a8a; padding-bottom: 10px;">
                    <button id="btn-close-chat" style="background: none; border: none; color: #38bdf8; font-size: 24px; cursor: pointer;">←</button>
                    <h3 id="chat-title" style="margin: 0;">Чат</h3>
                </div>
                <div id="messagesBox"></div>
                <div class="chat-input-area">
                    <input type="text" id="msgInput" class="chat-input" placeholder="Сообщение...">
                    <button id="btn-send-msg" class="send-btn">➤</button>
                </div>
            </div>
        </div>

        <div id="tab-profile" class="content">
            <div style="text-align: center; padding: 30px;">
                <div class="avatar" style="width: 100px; height: 100px; font-size: 50px; margin: 0 auto 15px;">👤</div>
                <h2 style="margin: 0;" id="profileUsername">@...</h2>
                <p style="color: #8b98b8; margin-top: 5px;">Баланс: 💎 <span id="profileBalance">0</span></p>
            </div>
            <button id="btn-logout" style="width: 100%; padding: 15px; border-radius: 12px; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; font-weight: bold; cursor: pointer;">Выйти</button>
        </div>

        <div class="nav">
            <div id="nav-chats" class="nav-item active"><div class="icon">💬</div>Чаты</div>
            <div id="nav-profile" class="nav-item"><div class="icon">👤</div>Профиль</div>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBghMQlLcZxnxn9k7X5MkivFD8pIA2tDLE",
    authDomain: "yoron-messenger.firebaseapp.com",
    databaseURL: "https://yoron-messenger-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "yoron-messenger",
    storageBucket: "yoron-messenger.firebasestorage.app",
    messagingSenderId: "197415382088",
    appId: "1:197415382088:web:d8f26bcbf8cef7bbfd7c7d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let isLoginMode = false;
  let currentUser = "";

  const errorBox = document.getElementById('errorBox');

  function showError(msg) {
      errorBox.innerText = "Ошибка: " + msg;
      errorBox.style.display = 'block';
  }

  document.getElementById('auth-toggle-link').onclick = () => {
      errorBox.style.display = 'none';
      isLoginMode = !isLoginMode;
      document.getElementById('btn-register').style.display = isLoginMode ? 'none' : 'block';
      document.getElementById('btn-login').style.display = isLoginMode ? 'block' : 'none';
      document.getElementById('auth-toggle-text').innerText = isLoginMode ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
      document.getElementById('auth-toggle-link').innerText = isLoginMode ? 'Создать' : 'Войти';
  };

  document.getElementById('btn-register').onclick = async () => {
      errorBox.style.display = 'none';
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      
      if (!username || !password) return showError('Заполните все поля!');
      if (password.length < 6) return showError('Пароль должен быть минимум 6 символов!');
      
      const cleanUsername = username.replace('@', '').toLowerCase();
      const email = cleanUsername + '@yoron.com';

      try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          await set(ref(db, 'users/' + userCredential.user.uid), { username: cleanUsername, balance: 0, inventory: [] });
          showApp(cleanUsername, 0);
      } catch (error) {
          showError(error.message);
      }
  };

  document.getElementById('btn-login').onclick = async () => {
      errorBox.style.display = 'none';
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const cleanUsername = username.replace('@', '').toLowerCase();
      const email = cleanUsername + '@yoron.com';

      try {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const snapshot = await get(ref(db, 'users/' + userCredential.user.uid));
          if (snapshot.exists()) {
              showApp(snapshot.val().username, snapshot.val().balance);
          }
      } catch (error) {
          showError(error.message);
      }
  };

  document.getElementById('btn-logout').onclick = () => {
      signOut(auth).then(() => {
          document.getElementById('screen-main').style.display = 'none';
          document.getElementById('screen-auth').classList.add('active');
          document.getElementById('regUsername').value = '';
          document.getElementById('regPassword').value = '';
          errorBox.style.display = 'none';
      });
  };

  document.getElementById('nav-chats').onclick = () => switchTab('chats');
  document.getElementById('nav-profile').onclick = () => switchTab('profile');
  document.getElementById('chat-btn-ai').onclick = () => openChat('ai');
  document.getElementById('chat-btn-all').onclick = () => openChat('all');
  document.getElementById('btn-close-chat').onclick = closeChat;
  document.getElementById('btn-send-msg').onclick = sendMessage;

  function showApp(username, balance) {
      currentUser = username;
      document.getElementById('screen-auth').classList.remove('active');
      document.getElementById('screen-main').style.display = 'flex';
      document.getElementById('profileUsername').innerText = '@' + username;
      document.getElementById('balanceDisplay').innerText = balance;
      document.getElementById('profileBalance').innerText = balance;
  }

  function switchTab(tab) {
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('nav-' + tab).classList.add('active');
  }

  let currentChat = 'all';
  function openChat(chatName) {
      currentChat = chatName;
      document.getElementById('chat-title').innerText = chatName === 'ai' ? '@ai (ИИ)' : '@all (Общий)';
      document.getElementById('chat-list').style.display = 'none';
      document.getElementById('chat-room').style.display = 'flex';
      
      const messagesBox = document.getElementById('messagesBox');
      messagesBox.innerHTML = '';
      
      const chatRef = ref(db, 'chats/' + currentChat);
      onValue(chatRef, (snapshot) => {
          messagesBox.innerHTML = '';
          snapshot.forEach((child) => {
              const msg = child.val();
              const isMine = msg.sender === currentUser;
              messagesBox.innerHTML += `<div class="msg ${isMine ? 'mine' : 'theirs'}">
                  <div style="font-size: 10px; font-weight: bold; opacity: 0.7; margin-bottom: 3px;">${isMine ? 'Вы' : msg.sender}</div>
                  ${msg.text}
              </div>`;
          });
          messagesBox.scrollTop = messagesBox.scrollHeight;
      });
  }

  function closeChat() {
      document.getElementById('chat-list').style.display = 'block';
      document.getElementById('chat-room').style.display = 'none';
  }

  function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (text !== '') {
          const chatRef = ref(db, 'chats/' + currentChat);
          push(chatRef, { text: text, sender: currentUser, time: Date.now() });
          input.value = '';
          
          if (currentChat === 'ai') {
              setTimeout(() => {
                  let aiReply = "Я ИИ-помощник Yoron. Спроси меня про кристаллы или подарки!";
                  const lowerText = text.toLowerCase();
                  if (lowerText.includes('привет')) aiReply = "Привет! Рад тебя видеть в Yoron. Чем могу помочь?";
                  else if (lowerText.includes('кристалл')) aiReply = "Кристаллы 💎 — это внутренняя валюта. Их можно тратить на подарки!";
                  else if (lowerText.includes('подарок')) aiReply = "В магазине есть обычные и легендарные подарки 👑!";
                  push(chatRef, { text: aiReply, sender: '@ai', time: Date.now() });
              }, 1000);
          }
      }
  }
</script>
</body>
</html>
