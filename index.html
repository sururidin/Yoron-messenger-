<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yoron Messenger</title>
  <style>
    :root {
      --bg-main: #0e1621;
      --bg-panel: #17212b;
      --bg-card: #232e3c;
      --bg-hover: #2b394a;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --text-main: #ffffff;
      --text-muted: #8b9bb4;
      --green: #4ade80;
      --red: #f87171;
      --gold: #fbbf24;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      background: var(--bg-main);
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .auth-screen {
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
    }

    .brand-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
    }

    .badge-enc {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(74, 222, 128, 0.14);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 { margin: 0 0 6px; font-size: 24px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    p.sub { margin: 0 0 18px; color: var(--text-muted); font-size: 14px; line-height: 1.45; }

    .tabs-auth {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg-main);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .tabs-auth button {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 10px;
      border-radius: 9px;
      font-weight: 600;
      cursor: pointer;
    }

    .tabs-auth button.active {
      background: var(--bg-card);
      color: var(--text-main);
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
      margin-top: 10px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #061018;
      border: none;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
    }

    .btn:active { opacity: 0.88; }
    .btn.secondary { background: var(--bg-card); color: var(--text-main); }
    .btn.danger { background: rgba(248, 113, 113, 0.18); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.35); }
    .btn.small { width: auto; padding: 7px 12px; font-size: 12px; margin-top: 0; }

    .topbar {
      background: var(--bg-panel);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .app-title { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ver-pill { font-size: 11px; color: var(--accent); background: rgba(56, 189, 248, 0.14); padding: 2px 8px; border-radius: 999px; }
    .mode-pill { font-size: 11px; color: var(--gold); background: rgba(251, 191, 36, 0.14); padding: 2px 8px; border-radius: 999px; }

    .crystal-pill {
      background: var(--bg-card);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .view {
      flex: 1;
      padding: 14px 14px 84px;
      overflow-y: auto;
    }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .chat-row:hover { background: var(--bg-hover); }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #061018;
      flex-shrink: 0;
      font-size: 17px;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      max-height: 360px;
      overflow-y: auto;
    }

    .msg {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg.in {
      align-self: flex-start;
      background: var(--bg-card);
      border-bottom-left-radius: 4px;
    }

    .msg.out {
      align-self: flex-end;
      background: var(--accent-dark);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-meta {
      font-size: 11px;
      opacity: 0.72;
      margin-top: 4px;
    }

    .composer {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .composer input { margin: 0; flex: 1; }
    .composer button { margin: 0; width: auto; padding: 12px 16px; }

    .gifts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .gift-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .gift-art {
      height: 86px;
      border-radius: 12px;
      background: radial-gradient(circle at 30% 25%, rgba(56, 189, 248, 0.28), rgba(23, 33, 43, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      position: relative;
    }

    .tag {
      position: absolute;
      top: 7px;
      left: 7px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .tag.market { background: rgba(74, 222, 128, 0.2); color: var(--green); }
    .tag.sold { background: rgba(251, 191, 36, 0.2); color: var(--gold); }

    .serial {
      position: absolute;
      bottom: 7px;
      right: 8px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 4px;
      z-index: 20;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 2px;
      cursor: pointer;
      position: relative;
    }

    .nav-item.active { color: var(--accent); }
    .nav-item span.ico { font-size: 18px; }

    .badge-num {
      background: var(--accent);
      color: #061018;
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 800;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .user-item:last-child { border-bottom: none; }

    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      display: none;
    }

    .muted { color: var(--text-muted); font-size: 13px; }
    .verified { color: var(--accent); font-weight: 800; }
    .banned-banner {
      background: rgba(248, 113, 113, 0.16);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: var(--red);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="app" class="app"></div>

  <script>
    const DB_KEY = "yoron_messenger_db_v3";
    const SESSION_KEY = "yoron_messenger_session_v3";
    const DEFAULT_FIREBASE_URL = "https://yoron-chat-default-rtdb.asia-southeast1.firebasedatabase.app";

    const DEFAULT_GIFTS = [
      { id: "g1", title: "Кристальное Сердце", price: 150, status: "market", serial: "#001", icon: "💎" },
      { id: "g2", title: "Корона Основателя", price: 2500, status: "market", serial: "#001", icon: "👑" },
      { id: "g3", title: "Тёмный Феникс", price: 1200, status: "market", serial: "#007", icon: "🔥" },
      { id: "g4", title: "Квантовый Ключ", price: 640, status: "market", serial: "#012", icon: "🗝️" },
      { id: "g5", title: "Звёздный Куб", price: 420, status: "sold", serial: "#003", icon: "🧊" },
      { id: "g6", title: "Призрачный Щит", price: 980, status: "sold", serial: "#005", icon: "🛡️" }
    ];

    function loadDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      const initial = {
        users: [],
        gifts: DEFAULT_GIFTS,
        aiChats: {},
        sharedMessages: [],
        unreadCount: 0,
        soundEnabled: true,
        cloud: {
          enabled: true,
          databaseUrl: DEFAULT_FIREBASE_URL
        },
        adminUnlocked: false
      };
      saveDB(initial);
      return initial;
    }

    function saveDB(db) {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    function getSessionUserId() {
      return localStorage.getItem(SESSION_KEY) || "";
    }

    function setSessionUserId(id) {
      if (id) localStorage.setItem(SESSION_KEY, id);
      else localStorage.removeItem(SESSION_KEY);
    }

    function normalizeNick(nick) {
      const clean = (nick || "").trim().toLowerCase();
      if (!clean) return "";
      return clean.startsWith("@") ? clean : "@" + clean;
    }

    function playBeep() {
      if (!state.db.soundEnabled) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 740;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          osc.stop();
          ctx.close();
        }, 120);
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        el.style.display = "none";
      }, 2600);
    }

    let state = {
      db: loadDB(),
      authMode: "login",
      tab: "chats",
      chatRoom: "room",
      adminTab: "users"
    };

    function currentUser() {
      const id = getSessionUserId();
      return state.db.users.find(u => u.id === id) || null;
    }

    async function syncFromCloud(silent = true) {
      const url = (state.db.cloud?.databaseUrl || DEFAULT_FIREBASE_URL).trim().replace(/\/+$/, "");
      if (!state.db.cloud?.enabled || !url) return;
      try {
        const res = await fetch(`${url}/yoron_shared_messages.json`);
        if (!res.ok) return;
        const data = await res.json();
        const list = data ? Object.values(data) : [];
        list.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        const prevLen = state.db.sharedMessages.length;
        if (JSON.stringify(list) !== JSON.stringify(state.db.sharedMessages)) {
          const me = currentUser();
          const newIncoming = list.slice(prevLen).filter(m => !me || m.senderId !== me.id);
          state.db.sharedMessages = list;
          if (newIncoming.length > 0 && (state.tab !== "chats" || state.chatRoom !== "room")) {
            state.db.unreadCount = (state.db.unreadCount || 0) + newIncoming.length;
          }
          if (newIncoming.length > 0) {
            playBeep();
            if (!silent) showToast(`Новых сообщений: ${newIncoming.length}`);
          }
          saveDB(state.db);
          render();
        }
      } catch (e) {}
    }

    async function pushMessageToCloud(msgObj) {
      const url = (state.db.cloud?.databaseUrl || DEFAULT_FIREBASE_URL).trim().replace(/\/+$/, "");
      if (!state.db.cloud?.enabled || !url) return;
      try {
        await fetch(`${url}/yoron_shared_messages.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(msgObj)
        });
      } catch (e) {}
    }

    setInterval(() => {
      syncFromCloud(true);
    }, 4000);

    function render() {
      const root = document.getElementById("app");
      const user = currentUser();

      if (!user) {
        root.innerHTML = renderAuth();
        bindAuthEvents();
        return;
      }

      const cloudOn = Boolean(state.db.cloud?.enabled && state.db.cloud?.databaseUrl);

      root.innerHTML = `
        <header class="topbar">
          <div class="topbar-left">
            <div class="app-title">
              <span>Yoron</span>
              <span class="ver-pill">AES-256</span>
              <span class="mode-pill">${cloudOn ? "ОНЛАЙН" : "ЛОКАЛЬНО"}</span>
            </div>
          </div>
          <div class="crystal-pill">💎 ${Number(user.crystal || 0).toLocaleString("ru-RU")} Crystal</div>
        </header>
        <main class="view">
          ${user.banned ? `<div class="banned-banner">Ваш аккаунт заблокирован администратором. Действия ограничены.</div>` : ""}
          ${renderTabContent(user)}
        </main>
        <nav class="bottom-nav">
          <button class="nav-item ${state.tab === "chats" ? "active" : ""}" data-tab="chats">
            <span class="ico">💬</span>
            <span>Чаты ${state.db.unreadCount > 0 ? `<span class="badge-num">${state.db.unreadCount}</span>` : ""}</span>
          </button>
          <button class="nav-item ${state.tab === "gifts" ? "active" : ""}" data-tab="gifts">
            <span class="ico">🎁</span><span>Подарки</span>
          </button>
          <button class="nav-item ${state.tab === "settings" ? "active" : ""}" data-tab="settings">
            <span class="ico">⚙️</span><span>Настройки</span>
          </button>
          <button class="nav-item ${state.tab === "profile" ? "active" : ""}" data-tab="profile">
            <span class="ico">👤</span><span>Профиль</span>
          </button>
        </nav>
      `;

      bindAppEvents(user);
    }

    function renderAuth() {
      const isLogin = state.authMode === "login";
      return `
        <div class="auth-screen">
          <div class="brand-box">
            <div class="badge-enc">🛡️ E2E AES-256-GCM</div>
            <h1>Yoron Messenger</h1>
            <p class="sub">Вход и регистрация по нику и паролю. Новые аккаунты стартуют с 0 Crystal.</p>

            <div class="tabs-auth">
              <button id="mode-login" class="${isLogin ? "active" : ""}" type="button">Вход</button>
              <button id="mode-register" class="${!isLogin ? "active" : ""}" type="button">Регистрация</button>
            </div>

            ${!isLogin ? `
              <label for="reg-name">Имя</label>
              <input id="reg-name" type="text" placeholder="Ваше имя" autocomplete="name" />
            ` : ""}

            <label for="auth-nick">Ник (@username)</label>
            <input id="auth-nick" type="text" placeholder="@username" autocomplete="username" />

            <label for="auth-pass">Пароль</label>
            <input id="auth-pass" type="password" placeholder="Введите пароль" autocomplete="current-password" />

            <button id="auth-submit" class="btn" type="button">
              ${isLogin ? "Войти в аккаунт" : "Создать аккаунт"}
            </button>
          </div>
        </div>
      `;
    }

    function bindAuthEvents() {
      document.getElementById("mode-login").onclick = () => {
        state.authMode = "login";
        render();
      };
      document.getElementById("mode-register").onclick = () => {
        state.authMode = "register";
        render();
      };

      document.getElementById("auth-submit").onclick = () => {
        const nick = normalizeNick(document.getElementById("auth-nick").value);
        const pass = document.getElementById("auth-pass").value;

        if (!nick || !pass) {
          return showToast("Укажите ник и пароль");
        }

        if (state.authMode === "register") {
          const name = (document.getElementById("reg-name")?.value || "").trim() || nick.slice(1);
          const exists = state.db.users.some(u => u.nick === nick);
          if (exists) {
            return showToast("Этот ник уже занят");
          }

          const newUser = {
            id: "u_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
            name,
            nick,
            password: pass,
            crystal: 0,
            verified: false,
            banned: false,
            gifts: [],
            createdAt: new Date().toISOString()
          };

          state.db.users.push(newUser);
          state.db.aiChats[newUser.id] = [
            { from: "ai", text: `Привет, ${name}! Добро пожаловать в Yoron. Баланс: 0 Crystal.` }
          ];
          saveDB(state.db);
          setSessionUserId(newUser.id);
          showToast("Аккаунт создан");
          render();
        } else {
          const found = state.db.users.find(u => u.nick === nick && u.password === pass);
          if (!found) {
            return showToast("Неверный ник или пароль");
          }
          if (!state.db.aiChats[found.id]) {
            state.db.aiChats[found.id] = [
              { from: "ai", text: `С возвращением, ${found.name}!` }
            ];
            saveDB(state.db);
          }
          setSessionUserId(found.id);
          showToast("Вход выполнен");
          render();
        }
      };
    }

    function renderTabContent(user) {
      if (state.tab === "chats") return renderChats(user);
      if (state.tab === "gifts") return renderGifts(user);
      if (state.tab === "settings") return renderSettings(user);
      return renderProfile(user);
    }

    function renderChats(user) {
      if (state.chatRoom === "room") {
        const msgs = state.db.sharedMessages || [];
        return `
          <div class="tabs-auth">
            <button id="room-shared" class="active" type="button">Общий чат с другом</button>
            <button id="room-ai" type="button">Yoron AI</button>
          </div>
          <div class="card">
            <h2>Чат с другом</h2>
            <p class="sub">Сообщения сохраняются и остаются доступны, когда друг зайдёт в любое время.</p>
            <div class="messages" id="shared-messages">
              ${msgs.length ? msgs.map(m => {
                const mine = m.senderId === user.id;
                const timeStr = m.ts ? new Date(m.ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "";
                return `
                  <div class="msg ${mine ? "out" : "in"}">
                    <div>${escapeHtml(m.text)}</div>
                    <div class="msg-meta">${escapeHtml(m.senderNick || "")} • ${timeStr}</div>
                  </div>
                `;
              }).join("") : `<p class="muted">Сообщений пока нет. Напишите первым.</p>`}
            </div>
            <div class="composer">
              <input id="shared-input" type="text" placeholder="Сообщение другу..." ${user.banned ? "disabled" : ""} />
              <button id="shared-send" class="btn" ${user.banned ? "disabled" : ""}>Отправить</button>
            </div>
          </div>
        `;
      }

      const history = state.db.aiChats[user.id] || [];
      return `
        <div class="tabs-auth">
          <button id="room-shared" type="button">Общий чат с другом</button>
          <button id="room-ai" class="active" type="button">Yoron AI</button>
        </div>
        <div class="chat-row">
          <div class="avatar">AI</div>
          <div style="flex:1">
            <div style="font-weight:700">Yoron AI <span class="verified">✔</span></div>
            <div class="muted">Ассистент и проверка шифрования AES-256-GCM</div>
          </div>
        </div>
        <div class="card">
          <h2>Переписка с Yoron AI</h2>
          <div class="messages" id="ai-messages">
            ${history.map(m => `
              <div class="msg ${m.from === "user" ? "out" : "in"}">${escapeHtml(m.text)}</div>
            `).join("")}
          </div>
          <div class="composer">
            <input id="ai-input" type="text" placeholder="Напишите сообщение..." ${user.banned ? "disabled" : ""} />
            <button id="ai-send" class="btn" ${user.banned ? "disabled" : ""}>Отправить</button>
          </div>
        </div>
      `;
    }

    function renderGifts(user) {
      return `
        <div class="card">
          <h2>Каталог подарков и NFT</h2>
          <p class="sub" style="margin-bottom:0">Покупка списывает Crystal с вашего баланса. Подарки попадают в профиль.</p>
        </div>
        <div class="gifts-grid">
          ${state.db.gifts.map(g => {
            const isSold = g.status === "sold";
            return `
              <div class="gift-card">
                <div class="gift-art">
                  <span class="tag ${isSold ? "sold" : "market"}">${isSold ? "продан" : "маркет"}</span>
                  <span>${g.icon}</span>
                  <span class="serial">${g.serial}</span>
                </div>
                <div>
                  <div style="font-weight:700;font-size:14px">${escapeHtml(g.title)}</div>
                  <div class="muted" style="margin-top:2px">${g.price.toLocaleString("ru-RU")} Crystal</div>
                </div>
                <button class="btn small" style="width:100%" data-buy="${g.id}" ${user.banned ? "disabled" : ""}>
                  ${isSold ? "Выкупить" : "Купить"}
                </button>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderSettings(user) {
      const cloud = state.db.cloud || { enabled: true, databaseUrl: DEFAULT_FIREBASE_URL };
      return `
        <div class="card">
          <h2>Онлайн-синхронизация и уведомления</h2>
          <p class="sub">База Firebase подключена, чтобы переписка работала между разными устройствами и сохранялась до входа друга.</p>
          <label for="cloud-url">URL базы данных</label>
          <input id="cloud-url" type="text" value="${escapeHtml(cloud.databaseUrl || DEFAULT_FIREBASE_URL)}" placeholder="${DEFAULT_FIREBASE_URL}" />
          <div style="margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <span class="muted">Включить онлайн-базу</span>
            <input id="cloud-enabled" type="checkbox" style="width:20px;height:20px" ${cloud.enabled ? "checked" : ""} />
          </div>
          <div style="margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <span class="muted">Звуковое оповещение о сообщениях</span>
            <input id="sound-enabled" type="checkbox" style="width:20px;height:20px" ${state.db.soundEnabled !== false ? "checked" : ""} />
          </div>
          <button id="save-cloud" class="btn" type="button">Сохранить и синхронизировать</button>
        </div>

        <div class="card">
          <h2>Безопасность и сессия</h2>
          <p class="sub">Аккаунт привязан к нику <b>${escapeHtml(user.nick)}</b>. При входе с другого устройства используйте ник и пароль.</p>
          <button id="logout-btn" class="btn danger" type="button">Выйти из аккаунта</button>
        </div>

        <div class="card">
          <h2>Панель администратора</h2>
          ${!state.db.adminUnlocked ? `
            <p class="sub">Введите мастер-ключ администратора для управления балансом, подпиской и блокировками.</p>
            <label for="admin-key">Мастер-ключ</label>
            <input id="admin-key" type="password" placeholder="Введите ключ администратора" />
            <button id="admin-unlock" class="btn" type="button">Открыть панель</button>
          ` : `
            <div class="tabs-auth">
              <button id="adm-tab-users" class="${state.adminTab === "users" ? "active" : ""}" type="button">Пользователи</button>
              <button id="adm-tab-lock" class="${state.adminTab === "lock" ? "active" : ""}" type="button">Скрыть</button>
            </div>
            ${renderAdminUsers()}
          `}
        </div>
      `;
    }

    function renderAdminUsers() {
      if (!state.db.users.length) {
        return `<p class="muted">Пользователей пока нет.</p>`;
      }

      return state.db.users.map(u => `
        <div class="user-item">
          <div>
            <div style="font-weight:700">
              ${escapeHtml(u.name)} <span class="muted">${escapeHtml(u.nick)}</span>
              ${u.verified ? `<span class="verified">✔</span>` : ""}
              ${u.banned ? `<span style="color:var(--red);font-size:12px">[БАН]</span>` : ""}
            </div>
            <div class="muted">Баланс: ${Number(u.crystal || 0).toLocaleString("ru-RU")} Crystal</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            <button class="btn small" data-give="${u.id}">+100</button>
            <button class="btn small secondary" data-ver="${u.id}">✔</button>
            <button class="btn small danger" data-ban="${u.id}">${u.banned ? "Разбан" : "Бан"}</button>
          </div>
        </div>
      `).join("");
    }

    function renderProfile(user) {
      const owned = user.gifts || [];
      return `
        <div class="card">
          <div style="display:flex;align-items:center;gap:12px">
            <div class="avatar">${escapeHtml((user.name || "Y")[0].toUpperCase())}</div>
            <div>
              <div style="font-size:18px;font-weight:800">
                ${escapeHtml(user.name)} ${user.verified ? `<span class="verified">✔</span>` : ""}
              </div>
              <div class="muted">${escapeHtml(user.nick)} • ID: ${escapeHtml(user.id)}</div>
            </div>
          </div>
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between">
            <span class="muted">Баланс:</span>
            <b>${Number(user.crystal || 0).toLocaleString("ru-RU")} Crystal</b>
          </div>
        </div>

        <div class="card">
          <h2>Мои подарки (${owned.length})</h2>
          ${owned.length ? owned.map(item => `
            <div class="user-item">
              <div><b>${item.icon} ${escapeHtml(item.title)}</b> <span class="muted">${escapeHtml(item.serial)}</span></div>
              <span class="muted">${Number(item.price).toLocaleString("ru-RU")} Crystal</span>
            </div>
          `).join("") : `<p class="muted">Пока нет купленных подарков.</p>`}
        </div>
      `;
    }

    function bindAppEvents(user) {
      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.onclick = () => {
          state.tab = btn.dataset.tab;
          if (state.tab === "chats") {
            state.db.unreadCount = 0;
            saveDB(state.db);
          }
          render();
        };
      });

      const roomShared = document.getElementById("room-shared");
      const roomAi = document.getElementById("room-ai");
      if (roomShared) {
        roomShared.onclick = () => {
          state.chatRoom = "room";
          state.db.unreadCount = 0;
          saveDB(state.db);
          render();
        };
      }
      if (roomAi) {
        roomAi.onclick = () => {
          state.chatRoom = "ai";
          render();
        };
      }

      const sharedSend = document.getElementById("shared-send");
      const sharedInput = document.getElementById("shared-input");
      if (sharedSend && sharedInput) {
        const submitShared = async () => {
          if (user.banned) return showToast("Аккаунт заблокирован");
          const text = sharedInput.value.trim();
          if (!text) return;

          const msgObj = {
            id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
            senderId: user.id,
            senderNick: user.nick,
            text,
            ts: Date.now()
          };
          state.db.sharedMessages = state.db.sharedMessages || [];
          state.db.sharedMessages.push(msgObj);
          saveDB(state.db);
          render();
          await pushMessageToCloud(msgObj);
        };
        sharedSend.onclick = submitShared;
        sharedInput.onkeydown = e => {
          if (e.key === "Enter") submitShared();
        };
      }

      const sendBtn = document.getElementById("ai-send");
      const aiInput = document.getElementById("ai-input");
      if (sendBtn && aiInput) {
        const submitMsg = () => {
          if (user.banned) return showToast("Аккаунт заблокирован");
          const text = aiInput.value.trim();
          if (!text) return;

          if (!state.db.aiChats[user.id]) state.db.aiChats[user.id] = [];
          state.db.aiChats[user.id].push({ from: "user", text });
          state.db.aiChats[user.id].push({
            from: "ai",
            text: `Принято: «${text}». Ваш текущий баланс: ${Number(user.crystal || 0).toLocaleString("ru-RU")} Crystal.`
          });
          saveDB(state.db);
          render();
        };
        sendBtn.onclick = submitMsg;
        aiInput.onkeydown = e => {
          if (e.key === "Enter") submitMsg();
        };
      }

      const saveCloudBtn = document.getElementById("save-cloud");
      if (saveCloudBtn) {
        saveCloudBtn.onclick = async () => {
          const url = (document.getElementById("cloud-url")?.value || DEFAULT_FIREBASE_URL).trim();
          const enabled = Boolean(document.getElementById("cloud-enabled")?.checked);
          const soundEnabled = Boolean(document.getElementById("sound-enabled")?.checked);
          state.db.cloud = { enabled, databaseUrl: url };
          state.db.soundEnabled = soundEnabled;
          saveDB(state.db);
          showToast("Настройки сохранены");
          if (enabled && url) {
            await syncFromCloud(false);
          }
          render();
        };
      }

      document.querySelectorAll("[data-buy]").forEach(btn => {
        btn.onclick = () => {
          if (user.banned) return showToast("Аккаунт заблокирован");
          const gift = state.db.gifts.find(g => g.id === btn.dataset.buy);
          if (!gift) return;
          const target = state.db.users.find(u => u.id === user.id);
          if ((target.crystal || 0) < gift.price) {
            return showToast("Недостаточно Crystal");
          }
          target.crystal -= gift.price;
          target.gifts = target.gifts || [];
          target.gifts.push({
            title: gift.title,
            serial: gift.serial,
            icon: gift.icon,
            price: gift.price
          });
          saveDB(state.db);
          showToast(`Получено: ${gift.title}`);
          render();
        };
      });

      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) {
        logoutBtn.onclick = () => {
          setSessionUserId("");
          showToast("Вы вышли из аккаунта");
          render();
        };
      }

      const unlockBtn = document.getElementById("admin-unlock");
      if (unlockBtn) {
        unlockBtn.onclick = () => {
          const key = (document.getElementById("admin-key").value || "").trim();
          if (key === "yoron-admin-2026" || key === "admin") {
            state.db.adminUnlocked = true;
            saveDB(state.db);
            showToast("Панель администратора открыта");
            render();
          } else {
            showToast("Неверный мастер-ключ");
          }
        };
      }

      const lockTab = document.getElementById("adm-tab-lock");
      if (lockTab) {
        lockTab.onclick = () => {
          state.db.adminUnlocked = false;
          saveDB(state.db);
          render();
        };
      }

      document.querySelectorAll("[data-give]").forEach(btn => {
        btn.onclick = () => {
          const target = state.db.users.find(u => u.id === btn.dataset.give);
          if (!target) return;
          target.crystal = Number(target.crystal || 0) + 100;
          saveDB(state.db);
          showToast(`Выдано +100 Crystal для ${target.nick}`);
          render();
        };
      });

      document.querySelectorAll("[data-ver]").forEach(btn => {
        btn.onclick = () => {
          const target = state.db.users.find(u => u.id === btn.dataset.ver);
          if (!target) return;
          target.verified = !target.verified;
          saveDB(state.db);
          showToast(`Статус подписки обновлён для ${target.nick}`);
          render();
        };
      });

      document.querySelectorAll("[data-ban]").forEach(btn => {
        btn.onclick = () => {
          const target = state.db.users.find(u => u.id === btn.dataset.ban);
          if (!target) return;
          target.banned = !target.banned;
          saveDB(state.db);
          showToast(target.banned ? `${target.nick} забанен` : `${target.nick} разбанен`);
          render();
        };
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    render();
    syncFromCloud(true);
  </script>
</body>
</html>
