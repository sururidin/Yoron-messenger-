<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoron — Общайся. Создавай. Вдохновляй.</title>
  <style>
    :root {
      --bg-0: #030714;
      --line: rgba(77, 166, 255, 0.24);
      --line-strong: rgba(96, 165, 250, 0.55);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: radial-gradient(circle at 50% 0%, #13295e 0%, var(--bg-0) 62%); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
    .hidden { display: none !important; }
    .phone-frame { width: 100%; max-width: 460px; min-height: 100vh; background: linear-gradient(180deg, #060f24 0%, #040917 100%); border-left: 1px solid var(--line); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-bottom: 72px; }
    .splash { min-height: 100vh; padding: 36px 24px 32px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; background: radial-gradient(circle at 50% 22%, rgba(56, 189, 248, 0.22), transparent 48%), linear-gradient(180deg, #050d22 0%, #091534 55%, #040814 100%); }
    .splash-title { font-size: 2.35rem; font-weight: 800; }
    .splash-slogan { color: #cbd5e1; font-size: 1rem; margin-top: 6px; }
    .btn-gradient { width: 100%; border: none; border-radius: 14px; padding: 15px 20px; font-size: 1.05rem; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(90deg, #7c3aed 0%, #3b82f6 100%); }
    .link-btn { background: none; border: none; color: #93c5fd; font-size: 0.92rem; cursor: pointer; margin-top: 12px; }
    .auth-screen { min-height: 100vh; padding: 28px 22px; display: flex; flex-direction: column; justify-content: center; }
    .card-box { background: rgba(11, 24, 54, 0.92); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .input { width: 100%; background: #050d20; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 0.95rem; }
    .top-bar { position: sticky; top: 0; z-index: 15; background: rgba(6, 15, 36, 0.94); border-bottom: 1px solid var(--line); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
    .pill-crystal { background: rgba(37, 99, 235, 0.22); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 700; color: #7dd3fc; cursor: pointer; }
    .subtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .subtab { background: #091633; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 7px 13px; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .subtab.active { background: linear-gradient(90deg, #2563eb, #7c3aed); color: #fff; border-color: transparent; }
    .page { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .chat-stream { background: rgba(6, 14, 34, 0.85); border: 1px solid var(--line); border-radius: 18px; padding: 12px; min-height: 280px; max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .bubble { max-width: 82%; padding: 9px 12px; border-radius: 15px; font-size: 0.88rem; background: #102046; align-self: flex-start; }
    .bubble.me { align-self: flex-end; background: #2563eb; }
    .chat-composer { display: flex; gap: 8px; }
    .promo-banner { border-radius: 16px; padding: 14px; background: linear-gradient(120deg, #4f46e5, #9333ea 55%, #db2777); }
    .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .gift-card { position: relative; overflow: hidden; background: #0d1d42; border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; cursor: pointer; }
    .gift-card.legendary { border-color: var(--gold); }
    .ribbon { position: absolute; top: 7px; right: -22px; transform: rotate(35deg); width: 74px; text-align: center; font-size: 0.6rem; font-weight: 800; padding: 2px 0; color: #fff; }
    .ribbon.market { background: #16a34a; }
    .ribbon.sold { background: #dc2626; }
    .price-chip { width: 100%; background: #07122b; border-radius: 999px; padding: 4px 6px; font-size: 0.72rem; font-weight: 700; color: #93c5fd; }
    .section-heading { font-size: 0.98rem; font-weight: 800; color: var(--gold); margin-top: 4px; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 460px; background: rgba(6, 14, 34, 0.96); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 4px; z-index: 20; }
    .nav-item { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
    .nav-item.active { color: var(--cyan); }
    .toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: #0f172a; border: 1px solid var(--cyan); color: #fff; padding: 9px 14px; border-radius: 12px; font-size: 0.82rem; z-index: 60; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <section id="view-splash" class="splash">
      <div>
        <div style="font-size:2.6rem;">💎</div>
        <div class="splash-title">Yoron</div>
        <div class="splash-slogan">Общайся. Создавай. Вдохновляй.</div>
      </div>
      <div style="font-size:5.5rem;">🔮</div>
      <div style="width:100%;">
        <button type="button" class="btn-gradient" id="splash-start-btn">Начать</button>
        <button type="button" class="link-btn" id="splash-login-link">Уже есть аккаунт? <strong>Войти</strong></button>
      </div>
    </section>

    <section id="view-auth" class="auth-screen hidden">
      <div class="card-box">
        <h2>Вход в Yoron</h2>
        <p style="color:var(--muted);font-size:0.86rem;">Стартовый баланс: <strong>0 Crystal</strong></p>
        <input class="input" id="auth-username" type="text" placeholder="@username (например, @yoron_user)" />
        <button type="button" class="btn-gradient" id="auth-submit-btn">Войти</button>
        <button type="button" class="link-btn" id="auth-back-splash">← Назад</button>
      </div>
    </section>

    <div id="view-main" class="hidden">
      <header class="top-bar">
        <strong id="header-title">💎 Yoron</strong>
        <button type="button" class="pill-crystal" id="top-balance-btn">💎 <span id="hud-crystals">0</span></button>
      </header>

      <section id="tab-chats" class="page">
        <div style="display:flex;gap:8px;align-items:center;">
          <input class="input" id="chat-target" style="padding:8px 10px;font-size:0.84rem;max-width:160px;" value="@alexey" />
          <button type="button" class="subtab" id="preset-ai-btn">@ai</button>
          <button type="button" class="subtab" id="preset-all-btn">@all</button>
        </div>
        <div class="chat-stream" id="chat-stream">
          <div class="bubble"><small>@alexey</small><div>Привет! Напиши сообщение или упомяни @ai.</div></div>
        </div>
        <form class="chat-composer" id="chat-form">
          <input class="input" id="chat-input" placeholder="Написать сообщение или @ai..." autocomplete="off" />
          <button type="submit" class="btn-gradient" style="width:auto;padding:11px 16px;font-size:0.88rem;">➤</button>
        </form>
      </section>

      <section id="tab-gifts" class="page hidden">
        <div class="promo-banner">
          <h3>Подарите эмоции</h3>
          <p style="font-size:0.84rem;">Подарки и NFT со статусами Маркет и Продан</p>
        </div>
        <div class="subtabs" id="rarity-filter-tabs">
          <button type="button" class="subtab active" data-filter="all">Все</button>
          <button type="button" class="subtab" data-filter="popular">Популярные</button>
          <button type="button" class="subtab" data-filter="rare">Редкие</button>
          <button type="button" class="subtab" data-filter="legendary">Легендарные</button>
        </div>
        <div class="shop-grid" id="standard-gifts-grid"></div>
        <div class="section-heading">👑 Легендарные</div>
        <div class="shop-grid" id="legendary-gifts-grid"></div>
      </section>

      <section id="tab-inv" class="page hidden">
        <div class="card-box">
          <h3>Моя коллекция</h3>
          <div class="shop-grid" id="inventory-grid"></div>
        </div>
      </section>

      <section id="tab-profile" class="page hidden">
        <div class="card-box">
          <h3>Профиль: <span id="profile-handle">@yoron_user</span></h3>
          <div>Баланс: <strong id="profile-crystal-big">0 Crystal</strong></div>
          <input class="input" id="master-key-input" type="password" placeholder="Мастер-ключ (yoron-admin-2026)" />
          <button type="button" class="btn-gradient" id="claim-key-btn">Активировать ключ (+1,000)</button>
          <button type="button" class="link-btn" id="switch-account-btn">Сменить @username</button>
        </div>
      </section>

      <nav class="bottom-nav">
        <button type="button" class="nav-item active" data-nav="chats"><span>💬</span><span>Чаты</span></button>
        <button type="button" class="nav-item" data-nav="gifts"><span>🎁</span><span>Подарки</span></button>
        <button type="button" class="nav-item" data-nav="inv"><span>🎒</span><span>Коллекция</span></button>
        <button type="button" class="nav-item" data-nav="profile"><span>⚙️</span><span>Профиль</span></button>
      </nav>
    </div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script>
    (function () {
      var DB_URL = "https://yoron-chat-default-rtdb.asia-southeast1.firebasedatabase.app";
      var ADMIN_KEY = "yoron-admin-2026";
      var ITEMS = [
        { id: "heart", name: "Сердце", price: 50, rarity: "popular", status: "market", emoji: "❤️", legendary: false },
        { id: "rose", name: "Роза", price: 120, rarity: "popular", status: "market", emoji: "🌹", legendary: false },
        { id: "crown", name: "Корона", price: 250, rarity: "rare", status: "market", emoji: "👑", legendary: false },
        { id: "festive", name: "Праздничный", price: 300, rarity: "popular", status: "market", emoji: "🎁", legendary: false },
        { id: "futuristic", name: "Футуристический", price: 500, rarity: "rare", status: "market", emoji: "🛡️", legendary: false },
        { id: "nft-gift", name: "NFT Подарок", price: 1000, rarity: "rare", status: "market", emoji: "💠", legendary: false },
        { id: "wood-horse", name: "Деревянная лошадь", price: 0, rarity: "popular", status: "sold", emoji: "🐴", legendary: false },
        { id: "dragon", name: "Дракон", price: 5000, rarity: "legendary", status: "market", emoji: "🐉", legendary: true },
        { id: "crystal-core", name: "Кристалл", price: 10000, rarity: "legendary", status: "market", emoji: "🔮", legendary: true },
        { id: "cyber-avatar", name: "Аватар", price: 15000, rarity: "legendary", status: "market", emoji: "🤖", legendary: true }
      ];
      var username = localStorage.getItem("yoron_u") || "";
      var crystals = Number(localStorage.getItem("yoron_c") || "0");
      var inventory = JSON.parse(localStorage.getItem("yoron_inv") || "[]");
      var filter = "all";

      function $(id) { return document.getElementById(id); }
      function toast(msg) {
        var el = $("toast");
        el.textContent = msg;
        el.classList.remove("hidden");
        setTimeout(function () { el.classList.add("hidden"); }, 2400);
      }
      function save() {
        localStorage.setItem("yoron_u", username);
        localStorage.setItem("yoron_c", String(crystals));
        localStorage.setItem("yoron_inv", JSON.stringify(inventory));
        $("hud-crystals").textContent = crystals.toLocaleString("en-US");
        $("profile-crystal-big").textContent = crystals.toLocaleString("en-US") + " Crystal";
        $("profile-handle").textContent = username || "@yoron_user";
      }
      function showView(id) {
        ["view-splash", "view-auth", "view-main"].forEach(function (v) {
          $(v).classList.toggle("hidden", v !== id);
        });
      }
      function switchNav(nav) {
        ["chats", "gifts", "inv", "profile"].forEach(function (t) {
          $("tab-" + t).classList.toggle("hidden", t !== nav);
        });
        document.querySelectorAll(".nav-item").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-nav") === nav);
        });
        if (nav === "gifts") renderMarket();
        if (nav === "inv") renderInv();
      }
      function appendMsg(from, to, text) {
        var b = document.createElement("div");
        b.className = "bubble" + (from === username ? " me" : "");
        b.innerHTML = "<small>" + from + " → " + to + "</small><div>" + text.replace(/</g, "&lt;") + "</div>";
        $("chat-stream").appendChild(b);
        $("chat-stream").scrollTop = $("chat-stream").scrollHeight;
        fetch(DB_URL + "/messages.json", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ from: from, to: to, text: text, ts: Date.now() })
        }).catch(function () {});
      }
      function cardHtml(it) {
        var sold = it.status === "sold";
        return '<div class="gift-card ' + (it.legendary ? "legendary" : "") + '" data-id="' + it.id + '">' +
          '<div class="ribbon ' + (sold ? "sold" : "market") + '">' + (sold ? "Продан" : "Маркет") + '</div>' +
          '<div style="font-size:1.9rem;">' + it.emoji + '</div>' +
          '<div style="font-size:0.76rem;font-weight:700;">' + it.name + '</div>' +
          '<div class="price-chip">' + (sold ? "💎 —" : "💎 " + it.price) + '</div>' +
          '</div>';
      }
      function renderMarket() {
        var list = ITEMS.filter(function (x) { return filter === "all" || x.rarity === filter; });
        $("standard-gifts-grid").innerHTML = list.filter(function (x) { return !x.legendary; }).map(cardHtml).join("");
        $("legendary-gifts-grid").innerHTML = list.filter(function (x) { return x.legendary; }).map(cardHtml).join("");
        document.querySelectorAll(".gift-card").forEach(function (el) {
          el.addEventListener("click", function () {
            var it = ITEMS.find(function (x) { return x.id === el.getAttribute("data-id"); });
            if (!it || it.status === "sold") { toast("Предмет уже продан"); return; }
            if (crystals < it.price) { toast("Не хватает Crystal. Активируйте ключ в Профиле"); return; }
            crystals -= it.price;
            inventory.unshift(it);
            save();
            var target = $("chat-target").value.trim() || "@all";
            appendMsg(username || "@user", target, it.emoji + " Подарил «" + it.name + "»");
            switchNav("chats");
            toast("Подарок отправлен!");
          });
        });
      }
      function renderInv() {
        if (!inventory.length) {
          $("inventory-grid").innerHTML = "<div style='color:var(--muted);font-size:0.84rem;grid-column:1/-1;'>Коллекция пуста.</div>";
          return;
        }
        $("inventory-grid").innerHTML = inventory.map(function (it) {
          return '<div class="gift-card ' + (it.legendary ? "legendary" : "") + '"><div style="font-size:1.9rem;">' + it.emoji + '</div><div style="font-size:0.76rem;font-weight:700;">' + it.name + '</div></div>';
        }).join("");
      }

      $("splash-start-btn").addEventListener("click", function () {
        if (username) { save(); showView("view-main"); switchNav("chats"); } else { showView("view-auth"); }
      });
      $("splash-login-link").addEventListener("click", function () { showView("view-auth"); });
      $("auth-back-splash").addEventListener("click", function () { showView("view-splash"); });
      $("auth-submit-btn").addEventListener("click", function () {
        var raw = $("auth-username").value.trim().replace(/^@+/, "");
        if (!raw) { toast("Введите @username"); return; }
        var nextU = "@" + raw;
        if (username !== nextU) { username = nextU; crystals = 0; inventory = []; }
        save();
        showView("view-main");
        switchNav("chats");
      });
      document.querySelectorAll(".nav-item").forEach(function (b) {
        b.addEventListener("click", function () { switchNav(b.getAttribute("data-nav")); });
      });
      $("top-balance-btn").addEventListener("click", function () { switchNav("profile"); });
      $("preset-ai-btn").addEventListener("click", function () { $("chat-target").value = "@ai"; });
      $("preset-all-btn").addEventListener("click", function () { $("chat-target").value = "@all"; });
      $("chat-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var txt = $("chat-input").value.trim();
        if (!txt) return;
        var target = $("chat-target").value.trim() || "@all";
        $("chat-input").value = "";
        appendMsg(username || "@user", target, txt);
        if (/@ai/i.test(txt) || target === "@ai") {
          setTimeout(function () {
            appendMsg("@ai", username || "@user", "Принято: «" + txt.replace(/@ai/gi, "").trim() + "»");
          }, 350);
        }
      });
      document.querySelectorAll("#rarity-filter-tabs .subtab").forEach(function (b) {
        b.addEventListener("click", function () {
          document.querySelectorAll("#rarity-filter-tabs .subtab").forEach(function (x) { x.classList.remove("active"); });
          b.classList.add("active");
          filter = b.getAttribute("data-filter");
          renderMarket();
        });
      });
      $("claim-key-btn").addEventListener("click", function () {
        if ($("master-key-input").value.trim() === ADMIN_KEY) {
          crystals += 1000;
          $("master-key-input").value = "";
          save();
          toast("Начислено +1,000 Crystal!");
        } else {
          toast("Неверный мастер-ключ");
        }
      });
      $("switch-account-btn").addEventListener("click", function () { showView("view-auth"); });
      save();
    })();
  </script>
</body>
</html>
